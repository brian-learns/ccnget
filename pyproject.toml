[project]
name = "ccnget"
version = "0.1.3"
description = "lookup urls and get files from Common Crawl News"
readme = "README.md"
authors = [
    { name = "Brian Learns", email = "epitome-tampers.1v@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.0.0",
    "python-dotenv>=1.1.0",
    "requests>=2.31.0",
    "selectolax>=0.4.11",
    "warcio>=1.8.1",
]

[project.scripts]
ccnget = "ccnget.geturl:main"


[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "argparse-manpage>=4.7",
    "bandit>=1.9.4",
    "interrogate>=1.7.0",
    "pytest>=9.1.1",
    "refurb>=2.3.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "vulture>=2.16",
]

[tool.pydoc-markdown.renderer]
type = "markdown"
filename = "api.md"

[tool.build_manpages]
manpages = [
    "man/ccnget.1:function=get_parser:module=ccnget.geturl",
]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "F",   # Pyflakes (catches undefined names / unused variables)
    "B",   # Bugbear (catches common design anti-patterns)
    "S",   # Bandit Automated Security checks
    "I",   # Isort (enforces clean import sorting structures)
    "N",   # PEP8 Naming convention enforcement
    "RUF"  # Ruff-specific absolute modern rules
]
ignore = [
    "S101", # Allows 'assert' statements for pytest modules
    "E501"  # Let the formatter handle long agent lines, don't trigger lint errors
]


[tool.bandit]
skips = ["B101", "B404", "B602"]

[tool.interrogate]
fail-under = 90
exclude = ["tests"]
ignore-init-method = true
ignore-module = true

[tool.ty]
rules = { all = "error" }
